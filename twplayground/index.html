            <p class="text-gray">Click buttons on left to add components here</p>

    <script>const searchInput = document.getElementById("searchInput");
const container = document.getElementById("field-list");
searchInput.addEventListener("input", (event)=>{
    const searchText = event.target.value.toLowerCase();
    console.log(searchText);
    renderFields(searchText);
});
const renderFields = (searchText)=>{
    container.replaceChildren();
    Object.entries(propertyConfig).forEach(([key, value])=>{
        const fieldDiv = document.createElement("div");
        if (value.type === 'mx') fieldDiv.innerHTML = `
                    <h3 class="font-bold text-sm border-b pb-1"><a href="https://tailwindcss.com/docs/${key}" target="blank">${value.title}</a></h3>
                    <div class="space-y-1 mt-1 max-w-36">
                        ${value.list.map((v)=>`<label><input type="checkbox" value="${v}" onchange="toggleClass(this)"> ${v}</label><br>`).join("")}
                    </div>
                    `;
        else if (value.type === 'x') fieldDiv.innerHTML = `
                    <h3 class="font-bold text-sm text-white"><a href="https://tailwindcss.com/docs/${key}" target="blank">${value.title}</a></h3>
                    <select class="w-full border rounded p-1 mt-1 max-w-36" onchange="applyClass(this, '${value.title}')">
                        <option value="">-- Select --</option>
                        ${value.list.map((v)=>`<option value="${v}">${v}</option>`).join("")}
                    </select>
                    `;
        else if (value.type === 'h') {
            fieldDiv.classList.add("col-span-3");
            fieldDiv.classList.add("bg-yellow-900");
            fieldDiv.classList.add("text-white");
            fieldDiv.innerHTML = `
                    <h3 class="font-bold bg-yellow text-sm border-l-4 p-3 ">${value.title}</h3>
                    `;
        } else fieldDiv.innerHTML = `
                    <h2 class="text-xl font-bold  mb-2">${key}</h2>
                    <ul class="list-disc pl-5 mb-4">
                    ${value.list.map((v)=>`<li class="font-mono">${v}</li>`).join("")}
                    </ul>
                    `;
        if (key.toLowerCase().indexOf(searchText.toLowerCase()) === -1) return;
        else if (searchText === '') {
            console.log('Adding', key);
            container.appendChild(fieldDiv);
        } else {
            console.log('Adding', key);
            container.appendChild(fieldDiv);
        }
    });
};
window.onload = ()=>{
    renderFields('');
};
let selectedElement = null;
function makeComponent(type) {
    let el;
    if (type === 'div') {
        el = document.createElement('div');
        el.textContent = "";
        el.className = "p-2 border border-dashed border-gray-400 drop-zone";
    } else if (type === 'span') {
        el = document.createElement('span');
        el.textContent = "New span";
        el.className = "p-2 border border-dashed border-gray-400 drop-zone";
    } else if (type === 'button') {
        el = document.createElement('button');
        el.textContent = "Click Me";
        el.className = "px-4 py-2 bg-blue-500 text-white rounded";
    } else if (type === 'textbox') {
        el = document.createElement('input');
        el.type = "text";
        el.placeholder = "Enter text";
        el.className = "border p-2";
    } else if (type === 'img') {
        el = document.createElement('img');
        el.src = "https://placehold.co/300x300";
        el.className = "w-32 h-32 object-cover border";
    }
    // attach event
    el.addEventListener("click", function(e) {
        e.stopPropagation();
        selectElement(el);
    });
    return el;
}
function clearStyles() {
    if (!selectedElement) return;
    // remove all tailwind utility classes
    selectedElement.className = "";
    // uncheck all checkboxes in properties
    document.querySelectorAll('#properties input[type=checkbox]').forEach((cb)=>{
        cb.checked = false;
    });
    // reset dropdowns
    document.querySelectorAll('#properties select').forEach((sel)=>{
        sel.selectedIndex = 0;
    });
    updateCode();
}
function addComponent(type) {
    if (!selectedElement || !selectedElement.classList.contains("drop-zone")) selectedElement = document.getElementById("designerView");
    const el = makeComponent(type);
    selectedElement.appendChild(el);
    selectElement(el);
    updateCode();
}
function deleteComponent() {
    if (!selectedElement) return;
    // Remove element from DOM
    selectedElement.remove();
    // Clear selection
    selectedElement = null;
    // Reset property panel
    document.querySelectorAll('#properties input[type=checkbox]').forEach((cb)=>{
        cb.checked = false;
    });
    document.querySelectorAll('#properties select').forEach((sel)=>{
        sel.selectedIndex = 0;
    });
    updateCode();
}
function selectElement(el) {
    if (selectedElement && selectedElement !== document.getElementById("designerView")) selectedElement.classList.remove("selected");
    selectedElement = el;
    selectedElement.classList.add("selected");
    document.getElementById("noSelection").classList.add("hidden");
    document.getElementById("properties").classList.remove("hidden");
    // Update properties pane
    updatePropertiesPane();
}
function updatePropertiesPane() {
    if (!selectedElement) return;
    const classes = selectedElement.className.split(/\s+/);
    // Sync checkboxes
    document.querySelectorAll('#properties input[type=checkbox]').forEach((cb)=>{
        cb.checked = classes.includes(cb.value);
    });
    // Sync dropdowns
    document.querySelectorAll('#properties select').forEach((sel)=>{
        const prevClass = sel.dataset.prevClass;
        if (prevClass && classes.includes(prevClass)) sel.value = prevClass;
        else {
            // If none of its options match the current element's classes
            const matching = Array.from(sel.options).find((opt)=>classes.includes(opt.value));
            if (matching) {
                sel.value = matching.value;
                sel.dataset.prevClass = matching.value;
            } else {
                sel.value = "";
                delete sel.dataset.prevClass;
            }
        }
    });
}
function formatHTML(html) {
    let formatted = '';
    const reg = /(>)(<)(\/*)/g;
    html = html.replace(reg, '$1\r\n$2$3');
    let pad = 0;
    html.split('\r\n').forEach((node)=>{
        let indent = 0;
        if (node.match(/.+<\/\w[^>]*>$/)) indent = 0;
        else if (node.match(/^<\/\w/)) {
            if (pad !== 0) pad -= 1;
        } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) indent = 1;
        else indent = 0;
        formatted += '  '.repeat(pad) + node + '\r\n';
        pad += indent;
    });
    return formatted.trim();
}
function updateClass(className) {
    if (!selectedElement) return;
    selectedElement.className += " " + className;
    updateCode();
}
function switchTab(tab) {
    if (tab === "designer") {
        document.getElementById("designerView").classList.remove("hidden");
        document.getElementById("codeView").classList.add("hidden");
        document.getElementById("designerTab").classList.add("active");
        document.getElementById("codeTab").classList.remove("active");
    } else {
        updateCode();
        document.getElementById("designerView").classList.add("hidden");
        document.getElementById("codeView").classList.remove("hidden");
        document.getElementById("designerTab").classList.remove("active");
        document.getElementById("codeTab").classList.add("active");
    }
}
function updateCode() {
    const canvas = document.getElementById("designerView").cloneNode(true);
    // remove selection outlines
    canvas.querySelectorAll("selected").forEach((el)=>el.classList.remove("selected"));
    document.getElementById("codeEditor").value = formatHTML(canvas.innerHTML.trim());
}
function toggleClass(input) {
    if (!selectedElement) return;
    if (input.checked) selectedElement.classList.add(input.value);
    else selectedElement.classList.remove(input.value);
    updateCode();
}
function applyClass(selectEl, category) {
    if (!selectedElement) return;
    const newClass = selectEl.value;
    if (propertyConfig && propertyConfig[category]) selectedElement.classList.remove(...propertyConfig[category].list);
    // apply new class if not empty
    if (newClass) {
        selectedElement.classList.add(newClass);
        selectEl.dataset.prevClass = newClass; // save for next change
    } else delete selectEl.dataset.prevClass; // clear if default selected
    updateCode();
}
// two-way sync: update designer from code tab
document.getElementById("codeEditor").addEventListener("input", ()=>{
    const code = document.getElementById("codeEditor").value;
    document.getElementById("designerView").innerHTML = code;
    // reattach events
    document.querySelectorAll("#designerView *").forEach((el)=>{
        el.addEventListener("click", function(e) {
            e.stopPropagation();
            selectElement(el);
        });
    });
});
// deselect when clicking on background
document.getElementById("designerView").addEventListener("click", (e)=>{
    if (e.target.id === "designerView") {
        if (selectedElement) selectedElement.classList.remove("selected");
        selectedElement = null;
        document.getElementById("noSelection").classList.remove("hidden");
        document.getElementById("properties").classList.add("hidden");
    }
});

</script>
